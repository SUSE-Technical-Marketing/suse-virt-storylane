<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUSE Virtualization: Interactive Labs Have Moved</title>
  <meta name="description" content="The SUSE Virtualization interactive demos have moved to suse.com.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.suse.com/products/rancher/virtualization/interactive-labs/">
  <meta http-equiv="refresh" content="3; url=https://www.suse.com/products/rancher/virtualization/interactive-labs/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
    }
    .moved-card {
      max-width: 480px;
      width: 100%;
      margin: 24px;
      padding: 48px 40px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .moved-logo { height: 32px; width: auto; margin-bottom: 28px; }
    .moved-title {
      font-family: var(--font-head);
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }
    .moved-body {
      color: var(--gray);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .moved-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: var(--green);
      color: #fff;
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 15px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .moved-btn:hover { background: var(--green-alt); text-decoration: none; }
    .moved-note {
      margin-top: 20px;
      font-size: 13px;
      color: var(--gray);
    }
  </style>
</head>
<body>
  <div class="moved-card">
    <img src="img/suse-logo.png" alt="SUSE" class="moved-logo">
    <div class="moved-title">This demo hub has moved</div>
    <p class="moved-body">The SUSE Virtualization interactive labs now live on suse.com. You'll be redirected automatically in a few seconds.</p>
    <a href="https://www.suse.com/products/rancher/virtualization/interactive-labs/" class="moved-btn">Go to Interactive Labs →</a>
    <div class="moved-note">suse.com/products/rancher/virtualization/interactive-labs</div>
  </div>
  <script>
    window.location.replace("https://www.suse.com/products/rancher/virtualization/interactive-labs/");
  </script>
</body>
</html>
